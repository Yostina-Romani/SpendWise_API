<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Edit Category</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg spend-navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="./dashboard.html">

                <span class="brand-small-icon">
                    S
                </span>

                SpendWise

            </a>


            <a
                href="./categories.html"
                class="back-link">

                ← Categories

            </a>

        </div>

    </nav>


    <!-- Page -->

    <main class="container form-page">

        <div class="form-card fade-in">

            <div class="form-icon edit-icon">
                ✎
            </div>

            <h1>
                Edit Category
            </h1>

            <p class="form-subtitle">
                Update your category information.
            </p>


            <form id="editCategory">


                <!-- Name -->

                <div class="form-group">

                    <label for="namecat">
                        Category Name
                    </label>

                    <input
                        type="text"
                        id="namecat"
                        class="form-control"
                        placeholder="Category name">

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="catdescription">
                        Category Description
                    </label>

                    <textarea
                        id="catdescription"
                        class="form-control"
                        rows="4"
                        placeholder="Category description"></textarea>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn btn-primary custom-btn w-100">

                    Save Changes

                </button>

            </form>

        </div>

    </main>


    <script src="../JS/editCategory.js"></script>

</body>

</html>

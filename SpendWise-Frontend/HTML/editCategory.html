<!doctype html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Edit Category</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="../CSS/theme.css">

    <link
        rel="stylesheet"
        href="../CSS/style.css">

    <link
        rel="stylesheet"
        href="../CSS/components.css">

</head>


<body>


    <!-- Navbar -->

    <div id="navbar"></div>


    <!-- Page -->

    <main class="container form-page">

        <div class="form-card fade-in">


            <!-- Icon -->

            <div class="form-icon">

                <i class="bi bi-pencil-square"></i>

            </div>


            <!-- Title -->

            <span class="section-label">
                CATEGORY MANAGEMENT
            </span>

            <h1 class="form-title">
                Edit Category
            </h1>

            <p class="form-subtitle">
                Update your category information.
            </p>


            <!-- Form -->

            <form id="editCategory">


                <!-- Name -->

                <div class="form-group">

                    <label for="namecat">

                        <i class="bi bi-tag"></i>

                        Category Name

                    </label>

                    <input
                        type="text"
                        id="namecat"
                        class="form-control"
                        placeholder="Enter category name">

                </div>


                <!-- Description -->

                <div class="form-group">

                    <label for="catdescription">

                        <i class="bi bi-card-text"></i>

                        Category Description

                    </label>

                    <textarea
                        id="catdescription"
                        class="form-control"
                        rows="4"
                        placeholder="Enter category description"></textarea>

                </div>


                <!-- Info -->

                <div class="form-info">

                    <i class="bi bi-info-circle"></i>

                    <div>

                        <strong>
                            Keep your categories organized
                        </strong>

                        <p>
                            Update the category name or description,
                            then save your changes.
                        </p>

                    </div>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="btn custom-btn w-100 mt-4">

                    <i class="bi bi-check2-circle me-2"></i>

                    Save Changes

                </button>


                <!-- Back -->

                <div class="form-footer">

                    <a
                        href="./categories.html"
                        class="back-link text-decoration-none">

                        <i class="bi bi-arrow-left me-1"></i>

                        Back to Categories

                    </a>

                </div>


            </form>

        </div>

    </main>


    <!-- Footer -->

    <div id="footer"></div>


    <!-- Shared Components -->

    <script src="../JS/components.js"></script>

    <script src="../JS/theme.js"></script>


    <!-- Page JavaScript -->

    <script src="../JS/editCategory.js"></script>


</body>

</html>

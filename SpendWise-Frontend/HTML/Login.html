<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css">

</head>

<body class="auth-page">


    <div class="auth-container">

        <div class="auth-card fade-in">


            <!-- Brand -->

            <div class="brand-section">

                <div class="brand-icon">
                    S
                </div>

                <h1>
                    SpendWise
                </h1>

                <p>
                    Manage your money smarter.
                </p>

            </div>


            <!-- Header -->

            <div class="form-header">

                <h2>
                    Welcome Back 👋
                </h2>

                <p>
                    Login to continue to your account
                </p>

            </div>


            <!-- Form -->

            <form id="formid">


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required>

                    <span
                        class="error"
                        id="emailerror">
                    </span>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        required>

                    <span
                        class="error"
                        id="passworderror">
                    </span>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="btn btn-primary custom-btn w-100">

                    Login

                </button>

            </form>


            <!-- Message -->

            <p
                id="message"
                class="message">
            </p>


            <!-- Footer -->

            <div class="auth-footer">

                Don't have an account?

                <a href="./register.html">
                    Create Account
                </a>

            </div>

            <div class="auth-footer">

                Forget your password

                <a href="./ResetPasswordEmail.html">
                    reset password
                </a>

            </div>

        </div>

    </div>


    <script src="../JS/login.js"></script>

</body>

</html>

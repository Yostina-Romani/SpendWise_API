<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise | Login</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/theme.css">
    <link rel="stylesheet" href="../CSS/components.css">
    <link rel="stylesheet" href="../CSS/home.css">
    <link rel="stylesheet" href="../CSS/navbar.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="spend-navbar">
        <div class="nav-container">

            <!-- Brand -->
            <a href="./Home.html="brand">
                <span class="brand-icon">
                    <i class="bi bi-wallet2"></i>
                </span>

                <span class="brand-name">SpendWise</span>
            </a>

            <!-- Desktop Links -->
            <div class="nav-links">
                <a href="./Home.html">Home</a>
            </div>

            <!-- Actions -->
            <div class="nav-actions">

                <!-- Theme Button -->
                <button
                    type="button"
                    class="theme-btn"
                    id="themeToggle"
                    aria-label="Toggle theme">

                    <i class="bi bi-moon"></i>
                </button>

                <a href="./Login.html" class="nav-btn login-btn">
                    Login
                </a>

                <a href="./Register.html" class="nav-btn register-btn">
                    Register
                </a>

            </div>

            <!-- Mobile Menu Button -->
            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Toggle navigation">

                <i class="bi bi-list"></i>
            </button>

        </div>

        <!-- Mobile Menu -->
        <div class="mobile-menu" id="mobileMenu">

            <a href="./Home.html">Home</a>

            <div class="mobile-actions">

                <button
                    type="button"
                    class="theme-btn"
                    id="mobileThemeToggle">

                    <i class="bi bi-moon"></i>
                    Theme
                </button>

                <a href="./Login.html" class="nav-btn login-btn">
                    Login
                </a>

                <a href="./Register.html" class="nav-btn register-btn">
                    Register
                </a>

            </div>
        </div>
    </nav>

    <!-- Login Content -->
    <div class="login-page">

        <!-- Overlay -->
        <div class="overlay"></div>

        <!-- Login Card -->
        <div class="login-card">

            <div class="text-center mb-4">
                <h1 class="logo">SpendWise</h1>
                <p class="subtitle">Manage your money wisely</p>
            </div>

            <form id="formid">

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email">

                    <span id="emailError" class="error-message"></span>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password">

                    <span id="passwordError" class="error-message"></span>
                </div>

                <!-- Remember & Forgot -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">
                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="rememberMe">

                        <label
                            class="form-check-label"
                            for="rememberMe">

                            Remember me
                        </label>
                    </div>

                    <a
                        href="./ResetPasswordEmail.html"
                        class="forgot-link">

                        Forgot Password?
                    </a>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn login-btn w-100">

                    Login
                </button>
            </form>

            <!-- Continue with Google -->
            <div class="google-login-wrapper">

                <div class="auth-divider">
                    <span>OR</span>
                </div>

                <button
                    type="button"
                    class="google-login-btn"
                    id="googleLoginBtn">

                    <span class="google-icon">
                        <i class="bi bi-google"></i>
                    </span>

                    <span class="google-btn-text">
                        Continue with Google
                    </span>
                </button>
            </div>

            <!-- Register -->
            <div class="register-text text-center mt-4">
                <span>Don't have an account?</span>

                <a href="./Register.html">
                    Create Account
                    <i class="bi bi-arrow-right"></i>
                </a>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="../JS/login.js"></script>
    <script src="../JS/components.js"></script>
    <script src="../JS/navbar.js"></script>

</body>
</html>

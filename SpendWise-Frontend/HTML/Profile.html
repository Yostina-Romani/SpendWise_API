<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - SpendWise</title>

    <link rel="stylesheet" href="../CSS/navbar.css">
    <link rel="stylesheet" href="../CSS/Profile.css">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="spend-navbar">

        <div class="nav-container">

            <a href="./Home.html" class="brand">
                <div class="brand-icon">
                    <i class="bi bi-wallet2"></i>
                </div>

                <span class="brand-name">SpendWise</span>
            </a>

            <div class="nav-links">

                <a href="./Home.html">
                    <i class="bi bi-house"></i>
                    Home
                </a>

                <a href="./UserDahboard.html">
                    <i class="bi bi-grid"></i>
                    Dashboard
                </a>

                <a href="./Profile.html" class="active">
                    <i class="bi bi-person"></i>
                    Profile
                </a>

            </div>

            <div class="nav-actions">

                <button id="themeToggle" class="theme-btn">
                    <i class="bi bi-moon"></i>
                </button>

                <button id="logoutBtn" class="nav-btn">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </button>

            </div>

        </div>

    </nav>


    <!-- Profile Page -->

    <main class="profile-page">

        <section class="profile-card">

            <div class="profile-header">

                <div class="profile-avatar">
                    <i class="bi bi-person"></i>
                </div>

                <div>
                    <h1>My Profile</h1>
                    <p>View your personal information</p>
                </div>

            </div>


            <!-- Loading -->

            <div id="loading" class="profile-message">
                <i class="bi bi-arrow-repeat"></i>
                Loading profile...
            </div>


            <!-- Profile Information -->

            <div id="profileContent" class="profile-content">

                <div class="profile-field">

                    <label>
                        <i class="bi bi-person"></i>
                        Name
                    </label>

                    <div id="profileName" class="profile-value">
                        -
                    </div>

                </div>


                <div class="profile-field">

                    <label>
                        <i class="bi bi-envelope"></i>
                        Email
                    </label>

                    <div id="profileEmail" class="profile-value">
                        -
                    </div>

                </div>


                <div class="profile-field">

                    <label>
                        <i class="bi bi-telephone"></i>
                        Phone Number
                    </label>

                    <div id="profilePhone" class="profile-value">
                        -
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="../JS/navbar.js"></script>
    <script src="../JS/Profile.js"></script>

</body>

</html>

<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Add Category</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg spend-navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="./dashboard.html">

                <span class="brand-small-icon">S</span>

                SpendWise

            </a>

            <a
                href="./dashboard.html"
                class="back-link">

                ← Dashboard

            </a>

        </div>

    </nav>


    <!-- Page -->
    <main class="container form-page">

        <div class="form-card fade-in">

            <div class="form-icon">
                +
            </div>

            <h1>
                Add Category
            </h1>

            <p class="form-subtitle">
                Create a new category to organize your expenses.
            </p>


            <form id="catform" enctype="multipart/form-data">

                <div class="form-group">

                    <label for="catname">
                        Category Name
                    </label>

                    <input
                        type="text"
                        id="catname"
                        class="form-control"
                        placeholder="e.g. Food">

                </div>
                <div class="form-group">

                    <label for="catimage">
                        Category image
                    </label>

                    <input
                        type="file"
                        id="catimage"
                        class="form-control" accept="image/*">

                </div>


                <div class="form-group">

                    <label for="catdescription">
                        Category Description
                    </label>

                    <textarea
                        id="catdescription"
                        class="form-control"
                        rows="4"
                        placeholder="Describe this category..."></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary custom-btn w-100">

                    Add Category

                </button>

            </form>

        </div>

    </main>


    <script src="../JS/addCategory.js"></script>

</body>

</html>

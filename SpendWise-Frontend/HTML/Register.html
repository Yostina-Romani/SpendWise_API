<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Register</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css">

</head>

<body class="auth-page">


    <div class="auth-container">

        <div class="auth-card register-card fade-in">


            <!-- Brand -->

            <div class="brand-section">

                <div class="brand-icon">
                    S
                </div>

                <h1>
                    SpendWise
                </h1>

                <p>
                    Start managing your money smarter.
                </p>

            </div>


            <!-- Header -->

            <div class="form-header">

                <h2>
                    Create Account ✨
                </h2>

                <p>
                    Create your account and get started
                </p>

            </div>


            <!-- Form -->

            <form id="register_form">


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name">

                    <span
                        class="error"
                        id="nameerror">
                    </span>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email">

                    <span
                        class="error"
                        id="emailerror">
                    </span>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create a password">

                    <span
                        class="error"
                        id="passworderror">
                    </span>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="passwordConfirmation">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="passwordConfirmation"
                        class="form-control"
                        placeholder="Confirm your password">

                    <span
                        class="error"
                        id="passwordConfiramtionError">
                    </span>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="btn btn-primary custom-btn w-100">

                    Create Account

                </button>

            </form>


            <!-- Message -->

            <p
                id="message"
                class="message">
            </p>


            <!-- Footer -->

            <div class="auth-footer">

                Already have an account?

                <a href="./login.html">
                    Login
                </a>

            </div>

        </div>

    </div>


    <script src="../JS/register.js"></script>

</body>

</html>

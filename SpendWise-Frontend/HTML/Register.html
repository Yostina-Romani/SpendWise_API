<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Create Account</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Project CSS -->
    <link rel="stylesheet" href="../CSS/theme.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/components.css">
</head>

<body class="register-page">

    <main class="register-wrapper">

        <div class="register-card">

            <!-- ================= LEFT SIDE ================= -->

            <section class="register-visual">

                <img
                    src="../images/image1.png"
                    alt="SpendWise"
                    class="register-image"
                >

                <div class="register-overlay"></div>

                <div class="register-brand">
                    <span class="brand-icon">
                        S
                    </span>

                    <span>
                        SpendWise
                    </span>
                </div>

                <div class="register-quote">

                    <h2>
                        Take control of
                        your money.
                    </h2>

                    <p>
                        Track your expenses,
                        manage your budget,
                        and make smarter financial decisions.
                    </p>

                </div>

            </section>


            <!-- ================= RIGHT SIDE ================= -->

            <section class="register-form-section">

                <div class="register-form-container">

                    <div class="register-header">

                        <div class="register-icon">
                            <i class="bi bi-person-plus"></i>
                        </div>

                        <h1>
                            Create your account
                        </h1>

                        <p>
                            Start managing your expenses with SpendWise.
                        </p>

                    </div>


                    <!-- REGISTER FORM -->

                    <form id="register_form">

                        <!-- Name -->

                        <div class="form-group">

                            <label for="name">
                                <i class="bi bi-person"></i>
                                Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter your name"
                                autocomplete="name"
                            >

                            <span
                                class="error"
                                id="nameerror"
                            ></span>

                        </div>


                        <!-- Email -->

                        <div class="form-group">

                            <label for="email">
                                <i class="bi bi-envelope"></i>
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                autocomplete="email"
                            >

                            <span
                                class="error"
                                id="emailerror"
                            ></span>

                        </div>


                        <!-- Password -->

                        <div class="form-group">

                            <label for="password">
                                <i class="bi bi-lock"></i>
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Create a password"
                                autocomplete="new-password"
                            >

                            <span
                                class="error"
                                id="passworderror"
                            ></span>

                        </div>


                        <!-- Confirm Password -->

                        <div class="form-group">

                            <label for="passwordConfirmation">
                                <i class="bi bi-shield-check"></i>
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="passwordConfirmation"
                                class="form-control"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                            >

                            <!-- Keep this ID exactly as your JS uses it -->

                            <span
                                class="error"
                                id="passwordConfiramtionError"
                            ></span>

                        </div>


                        <!-- Message -->

                        <p
                            id="message"
                            class="message"
                        ></p>


                        <!-- Button -->

                        <button
                            type="submit"
                            class="custom-btn register-submit-btn w-100"
                        >

                            <span>
                                Create Account
                            </span>

                            <i class="bi bi-arrow-right"></i>

                        </button>

                    </form>


                    <!-- Login -->

                    <div class="register-login">

                        <span>
                            Already have an account?
                        </span>

                        <a href="./login.html">
                            Login
                            <i class="bi bi-arrow-right"></i>
                        </a>

                    </div>


                    <!-- Back Home -->

                    <div class="register-back">

                        <a href="./index.html">
                            <i class="bi bi-arrow-left"></i>
                            Back to home
                        </a>

                    </div>

                </div>

            </section>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="../JS/components.js"></script>
    <script src="../JS/theme.js"></script>
    <script src="../JS/register.js"></script>

</body>

</html>

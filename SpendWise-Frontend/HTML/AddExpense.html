<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SpendWise - Add Expense">

    <title>SpendWise | Add Expense</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">


    <!-- Theme -->
    <link
        rel="stylesheet"
        href="../CSS/theme.css">


    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css">


    <!-- Components CSS -->
    <link
        rel="stylesheet"
        href="../CSS/components.css">

</head>


<body>


    <!-- Navbar -->
    <div id="navbar"></div>


    <!-- Main Content -->
    <main class="container form-page">

        <div class="form-card fade-in">


            <!-- Icon -->
            <div class="form-icon expense-icon">

                <i class="bi bi-wallet2"></i>

            </div>


            <!-- Section Label -->
            <span class="section-label">

                EXPENSE MANAGEMENT

            </span>


            <!-- Title -->
            <h1 class="form-title">

                Add Expense

            </h1>


            <!-- Subtitle -->
            <p class="form-subtitle">

                Record your spending and keep your finances organized.

            </p>


            <!-- Form -->
            <form id="addexpense">


                <!-- Category -->
                <div class="form-group">

                    <label for="categoryid">

                        <i class="bi bi-grid"></i>

                        Category

                    </label>


                    <select
                        id="categoryid"
                        class="form-select"
                        required>

                        <option value="">
                            Select Category
                        </option>

                    </select>

                </div>


                <!-- Amount -->
                <div class="form-group">

                    <label for="expenseamount">

                        <i class="bi bi-cash-stack"></i>

                        Expense Amount

                    </label>


                    <div class="input-group">

                        <span class="input-group-text">

                            $

                        </span>


                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            id="expenseamount"
                            class="form-control"
                            placeholder="0.00"
                            required>

                    </div>

                </div>


                <!-- Date -->
                <div class="form-group">

                    <label for="expensetime">

                        <i class="bi bi-calendar3"></i>

                        Date

                    </label>


                    <input
                        type="date"
                        id="expensetime"
                        class="form-control"
                        required>

                </div>


                <!-- Submit -->
                <button
                    type="submit"
                    class="btn custom-btn w-100">

                    <i class="bi bi-plus-circle me-2"></i>

                    Add Expense

                </button>

            </form>


            <!-- Info -->
            <div class="form-info">

                <i class="bi bi-lightbulb"></i>


                <div>

                    <strong>
                        Keep your expenses organized
                    </strong>


                    <p>
                        Add every expense with the correct
                        category and date to keep your
                        financial records accurate.
                    </p>

                </div>

            </div>


            <!-- Back -->
            <div class="form-footer">

                <a
                    href="./UserDashboard.html"
                    class="back-link">

                    <i class="bi bi-arrow-left"></i>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <div id="footer"></div>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Shared Components -->
    <script src="../JS/components.js"></script>


    <!-- Theme -->
    <script src="../JS/theme.js"></script>


    <!-- Add Expense JS -->
    <script src="../JS/addexpense.js"></script>

</body>

</html>

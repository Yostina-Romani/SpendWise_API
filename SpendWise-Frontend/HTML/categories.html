<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SpendWise - Categories</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="../CSS/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg spend-navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="./dashboard.html">

                <span class="brand-small-icon">
                    S
                </span>

                SpendWise

            </a>


            <a
                href="./dashboard.html"
                class="back-link">

                ← Dashboard

            </a>

        </div>

    </nav>


    <!-- Main -->

    <main class="container page-container">

        <!-- Header -->

        <div class="page-header fade-in">

            <div>

                <span class="section-label">
                    Organization
                </span>

                <h1>
                    Categories
                </h1>

                <p>
                    Manage your expense categories.
                </p>

            </div>


            <a
                href="./addCategory.html"
                class="btn btn-primary custom-btn">

                + Add Category

            </a>

        </div>


        <!-- Table -->

        <div class="table-card fade-in">

            <div class="table-responsive">

                <table class="table custom-table">

                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>   
                            <th>
                                Image
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="categoriesTable">

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script src="../JS/categories.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SpendWise - Manage your expense categories">

    <title>SpendWise | Categories</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================= BOOTSTRAP ICONS ================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ================= GOOGLE FONT ================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">


    <!-- ================= THEME ================= -->

    <link
        rel="stylesheet"
        href="../CSS/theme.css">


    <!-- ================= MAIN CSS ================= -->

    <link
        rel="stylesheet"
        href="../CSS/style.css">


    <!-- ================= COMPONENTS ================= -->

    <link
        rel="stylesheet"
        href="../CSS/components.css">

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    <div id="navbar"></div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="container page-container">


        <!-- ================= PAGE HEADER ================= -->

        <div class="page-header fade-in">


            <div>

                <span class="section-label">

                    ORGANIZATION

                </span>


                <h1>

                    Categories

                </h1>


                <p>

                    Manage and organize your expense categories.

                </p>

            </div>


            <!-- ADD CATEGORY -->

            <a
                href="./addCategory.html"
                class="btn custom-btn">

                <i class="bi bi-plus-circle me-2"></i>

                Add Category

            </a>

        </div>


        <!-- =================================================
             CATEGORIES TABLE
        ================================================== -->

        <div class="table-card fade-in">


            <!-- TABLE HEADER -->

            <div class="table-card-header">

                <div>

                    <h5 class="mb-1">

                        <i class="bi bi-grid me-2"></i>

                        Expense Categories

                    </h5>

                    <p class="mb-0">

                        View and manage your categories.

                    </p>

                </div>

            </div>


            <!-- TABLE -->

            <div class="table-responsive">

                <table class="table custom-table mb-0">


                    <thead>

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Image
                            </th>

                            <th>
                                Description
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <!--
                        IMPORTANT:
                        categories.js will insert
                        the categories here.
                    -->

                    <tbody id="categoriesTable">

                    </tbody>


                </table>

            </div>

        </div>


        <!-- ================= BACK LINK ================= -->

        <div class="text-center mt-4">

            <a
                href="./UserDashboard.html"
                class="back-link">

                <i class="bi bi-arrow-left me-1"></i>

                Back to Dashboard

            </a>

        </div>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <div id="footer"></div>


    <!-- ================= BOOTSTRAP JS ================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- ================= SHARED COMPONENTS ================= -->

    <script src="../JS/components.js"></script>


    <!-- ================= THEME ================= -->

    <script src="../JS/theme.js"></script>


    <!-- ================= PAGE JAVASCRIPT ================= -->

    <script src="../JS/categories.js"></script>


</body>

</html>
